name: ci

# Private repo. Builds core/ (kspcore) and runs every gate: unit tests, golden gates against harness/golden, capture gates
# against harness/captures, and the portable-libm checks. No KSP install and no Unreal are needed: the tests read
# core/testdata/GameData-mirror. See CLOUD-TASKS.md.

on:
  # Branches are tested by their pull request; push runs only on main (post-merge check).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-rel, linux-gcc-rel]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        # with: { lfs: true }   # only if the LFS lines in .gitattributes are enabled
      - name: Tools
        run: sudo apt-get install -y ninja-build clang cmake python3 ccache
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Build and test (${{ matrix.preset }})
        working-directory: core
        run: ./run_tests.sh -p ${{ matrix.preset }} -f
      - name: ccache stats
        if: always()
        run: ccache -s

  windows:
    runs-on: windows-latest
    env:
      # ccache as the MSVC compiler launcher. The objects embed their debug info (/Z7: core/CMakeLists.txt sets
      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded, CMP0141 is NEW via cmake_minimum_required 3.28), so no .pdb blocks
      # caching. run_tests.ps1 -Ci picks ccache up and turns the (uncacheable) PCH off, see core/README.md "CI speed".
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: windows-msvc-relwithdebinfo
          max-size: 1G
      - name: Build and test (MSVC, RelWithDebInfo; msvcr120 DLL libm)
        working-directory: core
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File run_tests.ps1 -Fresh -Ci
      - name: ccache stats
        if: always()
        run: ccache -s
