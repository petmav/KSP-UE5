# Publishes the progress page data (petmav.github.io/port/data.json) whenever the
# done fractions in analysis/tiering/progress.csv change on main.
# Needs the repository secret SITE_TOKEN: a fine-grained token with
# Contents: read and write on petmav/petmav.github.io only. Without it the job
# skips the publish step.
name: progress

on:
  push:
    branches: [main]
    paths:
      - analysis/tiering/progress.csv
      - analysis/tiering/work_packages.csv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
    steps:
      - name: Check token
        if: env.SITE_TOKEN == ''
        run: echo "::warning::SITE_TOKEN is not set; progress page not published"

      - uses: actions/checkout@v4
        if: env.SITE_TOKEN != ''
        with:
          sparse-checkout: analysis/tiering
          path: src

      - uses: actions/checkout@v4
        if: env.SITE_TOKEN != ''
        with:
          repository: petmav/petmav.github.io
          token: ${{ secrets.SITE_TOKEN }}
          path: site

      - name: Build and push data.json
        if: env.SITE_TOKEN != ''
        working-directory: site
        run: |
          python3 -I port/tools/build_data.py \
            --packages ../src/analysis/tiering/work_packages.csv \
            --status ../src/analysis/tiering/progress.csv \
            --out port/data.json
          if git diff --quiet -- port/data.json; then
            echo "data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add port/data.json
          git commit -m "Progress data update"
          git push
